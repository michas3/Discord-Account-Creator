name: Build AFKDummy JAR

on:
  push:
    branches: ["**"]
    paths:
      - "afkdummy/**"
      - ".github/workflows/build-afkdummy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build shadowJar
        working-directory: afkdummy
        run: gradle shadowJar --no-daemon --stacktrace

      - name: Upload afkdummy.jar
        uses: actions/upload-artifact@v4
        with:
          name: afkdummy-jar
          path: afkdummy/build/libs/afkdummy.jar
          if-no-files-found: error
          retention-days: 30
