name: Build AFKDummy JAR

on:
  push:
    branches: ["**"]
    paths:
      - "afkdummy/**"
      - ".github/workflows/build-afkdummy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # paperweight 1.7.7 + paper-api 1.21.4 are a verified compatible pair.
      # The NMS class names (ServerPlayer, Connection, etc.) are identical
      # across 1.21.x — swap these two strings when 1.26.3 ships a dev-bundle.
      - name: Pin known-good Paper versions in build.gradle.kts
        working-directory: afkdummy
        run: |
          sed -i 's|2\.0\.0-beta\.14|1.7.7|g'                   build.gradle.kts
          sed -i 's|1\.26\.3-R0\.1-SNAPSHOT|1.21.4-R0.1-SNAPSHOT|g' build.gradle.kts
          echo "--- build.gradle.kts after patch ---"
          cat build.gradle.kts

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build shadowJar
        working-directory: afkdummy
        run: gradle shadowJar --no-daemon --stacktrace

      - name: Upload afkdummy.jar
        uses: actions/upload-artifact@v4
        with:
          name: afkdummy-jar
          path: afkdummy/build/libs/afkdummy.jar
          if-no-files-found: error
          retention-days: 30
